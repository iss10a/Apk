workflows:
  imou-audio-controller-debug:
    name: Imou Audio Controller - Debug APK
    max_build_duration: 30
    environment:
      groups: []
      vars:
        JAVA_VERSION: "17"
      java: 17
    scripts:
      - name: Generate Gradle wrapper (jar is intentionally not committed)
        script: |
          # This repo ships gradle/wrapper/gradle-wrapper.properties (pins Gradle 8.7)
          # but not the wrapper jar itself, so a locally-installed Gradle
          # regenerates gradlew/gradlew.bat/gradle-wrapper.jar on the CI machine.
          # If Codemagic's image already provides a `gradle` binary this just works;
          # otherwise replace this step with your own way of installing Gradle 8.7.
          which gradle || echo "WARNING: system gradle not found, adjust this step"
          gradle wrapper --gradle-version 8.7 || true
          chmod +x ./gradlew

      - name: Build debug APK
        script: |
          ./gradlew assembleDebug --stacktrace

      - name: Locate the produced APK (do not assume the path)
        script: |
          find "$CM_BUILD_DIR" -name "*.apk" -print

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients: []
