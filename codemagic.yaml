workflows:
  android-debug-build:
    name: Imou Audio Controller - Android Debug APK
    max_build_duration: 30
    # mac_mini_m2: يعمل ضمن الخطة المجانية/الحالية (500 دقيقة مجانية شهريًا للحسابات
    # الشخصية) بخلاف linux_x2 / linux_x4 / windows_x2 / mac_mini_m4 التي تتطلب
    # تفعيل الفوترة (billing) صراحة على حساب Codemagic، وهو سبب رسالة الخطأ:
    # "The selected instance type is not available with the current billing plan."
    # ملاحظة: هذا لا يعني بناء تطبيق iOS إطلاقًا — لا يوجد أي استدعاء لـ xcodebuild
    # في هذا الملف، فقط ./gradlew. صور Codemagic لأجهزة Mac تأتي مع Android SDK
    # وGradle وJDK كاملة مثبّتة مسبقًا وتُستخدم هنا فقط لبناء APK أندرويد عادي.
    instance_type: mac_mini_m2
    environment:
      groups:
        # أنشئ مجموعة متغيرات بيئة باسم imou_credentials من لوحة Codemagic
        # (Environment variables) وضع فيها IMOU_APP_ID / IMOU_APP_SECRET
        # كمتغيرات بيئة سرّية (Secure). المجموعة اختيارية تمامًا في هذه المرحلة
        # لأنه لا يوجد استخدام فعلي لـ Imou SDK بعد.
        - imou_credentials
      java: 17
    scripts:
      - name: Make gradlew executable
        script: chmod +x ./gradlew

      - name: Bootstrap Gradle wrapper jar (gradle-wrapper.jar غير مرفوع في المستودع)
        script: |
          # نحتاج توليد gradle/wrapper/gradle-wrapper.jar فعليًا بنفس إصدار Gradle
          # المحدد في gradle/wrapper/gradle-wrapper.properties (8.7)، باستخدام أي
          # Gradle مثبّت مسبقًا على صورة الـCI (Linux أو macOS)، بدل رفع ملف .jar
          # ثنائي جاهز داخل المستودع.
          SYSTEM_GRADLE=""

          if command -v gradle >/dev/null 2>&1; then
            SYSTEM_GRADLE="gradle"
          fi

          if [ -z "$SYSTEM_GRADLE" ]; then
            CANDIDATE=$(find /Users/builder/programs /home/builder/programs \
              -maxdepth 1 -iname 'gradle-*' -type d 2>/dev/null \
              | sort -V | tail -n 1)
            if [ -n "$CANDIDATE" ] && [ -x "$CANDIDATE/bin/gradle" ]; then
              SYSTEM_GRADLE="$CANDIDATE/bin/gradle"
            fi
          fi

          if [ -z "$SYSTEM_GRADLE" ]; then
            echo "لم يُعثر على Gradle مثبّت مسبقًا على صورة الـCI. راجع توثيق Codemagic لمسار Gradle الحالي (docs.codemagic.io/specs-macos أو specs-linux)."
            exit 1
          fi

          echo "Using system Gradle: $SYSTEM_GRADLE"
          "$SYSTEM_GRADLE" wrapper --gradle-version 8.7

      - name: Build debug APK
        script: |
          # IMOU_APP_ID و IMOU_APP_SECRET (إن وُجدا في مجموعة imou_credentials)
          # يصلان تلقائيًا كمتغيرات بيئة، ويقرأهما app/build.gradle.kts عبر System.getenv().
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
